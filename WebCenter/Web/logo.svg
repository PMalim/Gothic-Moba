><path d="M52 50 L32 40 L14 54 L8 72 L14 90 L32 100 L52 92" fill="none" stroke="#000" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="butt"/></g></g>
  <rect x="73.5" y="324" width="160" height="3" fill="url(#rule)"/><rect x="526.5" y="324" width="160" height="3" fill="url(#rule)" transform="translate(0 0)"/>
